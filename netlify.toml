# netlify.toml - Netlify Configuration for Dawat-e-Islami & Quran Portal

[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Route all paths to /index.html with status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Feature Headers (Allow microphone for My Voice Studio)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"
